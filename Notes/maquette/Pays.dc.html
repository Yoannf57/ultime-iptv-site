<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ulti — Choisissez votre pays</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000000}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
.pays:hover{background:#141416}
</style>
</helmet>
<div style="background: #000000; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; min-width: 0">
  <header style="border-bottom: 1px solid #1C1C1E">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F5F5F7">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="10" stroke="#3A3A3E" stroke-width="3"></circle><circle cx="13" cy="13" r="10" stroke="#F5F5F7" stroke-width="3" stroke-linecap="round" stroke-dasharray="47 63" transform="rotate(-90 13 13)"></circle></svg>
        <span style="font-size: 21px; font-weight: 800; letter-spacing: -0.02em">Ulti <span style="font-weight: 600; color: #A1A1A6">IPTV</span></span>
      </a>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 96px 24px 120px">
    <h1 style="margin: 0; font-size: clamp(36px, 4.6vw, 60px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 800">Choisissez votre pays ou votre région</h1>
    <p style="margin: 14px 0 0; font-size: 21px; color: #8E8E93">Choose your country or region</p>

    <sc-for list="{{regions}}" as="r" hint-placeholder-count="3">
      <section style="margin-top: 64px">
        <h2 style="margin: 0 0 8px; padding-bottom: 16px; border-bottom: 1px solid #242428; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: #A1A1A6">{{r.titre}}</h2>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; column-gap: 16px">
          <sc-for list="{{r.pays}}" as="p" hint-placeholder-count="6">
            <li style="flex: 0 1 280px; min-width: 0">
              <a class="pays" href="Main.dc.html" aria-current="{{p.courant}}" style="display: flex; flex-direction: column; gap: 4px; padding: 16px 14px; margin: 0 -14px; border-radius: 14px; text-decoration: none; color: #F5F5F7">
                <span style="display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600">{{p.nom}}<sc-if value="{{p.actif}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"></path></svg></sc-if></span>
                <span style="font-size: 15px; color: #8E8E93">{{p.langue}}</span>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>

    <p style="margin: 72px 0 0; padding-top: 24px; border-top: 1px solid #242428; font-size: 15px; line-height: 1.6; color: #8E8E93">D'autres pays arrivent avec de nouvelles langues : Nederlands, Deutsch, Svenska, Norsk, Dansk, Suomi, Español, Italiano, Português.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var p = function (nom, langue, actif) {
      return { nom: nom, langue: langue, actif: !!actif, courant: actif ? 'page' : 'false' };
    };
    return {
      regions: [
        { titre: 'EUROPE', pays: [
          p('Belgique', 'Français'),
          p('France', 'Français', true),
          p('Ireland', 'English'),
          p('Luxembourg', 'Français'),
          p('Suisse', 'Français'),
          p('United Kingdom', 'English')
        ] },
        { titre: 'AMÉRIQUES', pays: [
          p('Canada', 'English'),
          p('Canada', 'Français'),
          p('United States', 'English')
        ] },
        { titre: 'AUTRES PAYS', pays: [
          p('International', 'English')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
